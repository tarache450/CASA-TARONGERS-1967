# =============================================================
# Nginx Configuration — Casa Tarongers 1967
# =============================================================
# Copy this file to: /etc/nginx/sites-available/casa-tarongers
# Then run:
#   ln -s /etc/nginx/sites-available/casa-tarongers /etc/nginx/sites-enabled/
#   nginx -t && systemctl restart nginx
#   certbot --nginx -d casa-tarongers-1967.com -d www.casa-tarongers-1967.com
# =============================================================

# Redirect www to non-www
server {
    listen 80;
    server_name www.casa-tarongers-1967.com;
    return 301 https://casa-tarongers-1967.com$request_uri;
}

# Main server block
server {
    listen 80;
    server_name casa-tarongers-1967.com;

    # --- Main application (reverse proxy to Node.js) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # --- GitHub Webhook endpoint (reverse proxy to webhook server) ---
    location /webhook {
        proxy_pass http://127.0.0.1:9000/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static assets caching ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}

# =============================================================
# After running certbot, it will automatically add HTTPS (443)
# server blocks with SSL certificates. No manual config needed.
# =============================================================
