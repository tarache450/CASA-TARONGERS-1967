name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: |
          npm run build
          mkdir -p dist/tmp
          touch dist/tmp/restart.txt
          cp server.prod.js dist/
          cp server.prod.js dist/server.js
          cp package.json dist/
          cp package-lock.json dist/
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_URL: https://casatarongers1967.com

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: u898585567
          password: ${{ secrets.FTP_PASSWORD }}
          server: 92.113.28.158
          port: 65002
          local_path: './dist/*'
          remote_path: '/home/u898585567/domains/casatarongers1967.com/public_html'
          sftp_only: false
          delete_remote_files: true
