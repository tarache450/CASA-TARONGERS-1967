name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: |
          npm run build
          mkdir -p dist/tmp
          touch dist/tmp/restart.txt
          cp server.prod.js dist/
          cp server.prod.js dist/server.js
          cp package.json dist/
          cp package-lock.json dist/
          echo "SUPABASE_URL=https://cinuivjqxnsmcdqdrasy.supabase.co" > dist/.env
          echo "SUPABASE_ANON_KEY=sb_publishable_pmlqfv43-CD33ot2pXFtmA_apcdGV9p" >> dist/.env
          echo "FAMILY_PIN=1967" >> dist/.env
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_URL: https://casatarongers1967.com
          VITE_SUPABASE_URL: https://cinuivjqxnsmcdqdrasy.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_pmlqfv43-CD33ot2pXFtmA_apcdGV9p

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: u898585567
          password: ${{ secrets.FTP_PASSWORD }}
          server: 92.113.28.158
          port: 65002
          local_path: './dist/*'
          remote_path: '/home/u898585567/domains/casatarongers1967.com/public_html'
          sftp_only: false
          delete_remote_files: false

      - name: Deploy via FTP Root Fallback
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: 92.113.28.158
          username: u898585567
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          port: 21
          protocol: ftps
          security: loose
          timeout: 180000

